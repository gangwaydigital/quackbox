# QuackBox — Docker Compose
# Your inbox, quacked open.
#
# Usage:
#   1. Place .mbox files in the data/ directory
#   2. Make sure Ollama is running on the host: ollama serve
#   3. Pull the embedding model: ollama pull nomic-embed-text
#   4. Run: docker compose up --build
#   5. Open http://localhost:5173

services:
  backend:
    build:
      context: ./backend
    container_name: quackbox-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - db-data:/app/db
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATA_DIR=/app/data
      - DB_DIR=/app/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: quackbox-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - API_URL=http://quackbox-backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
