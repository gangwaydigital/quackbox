# QuackBox — Docker Compose
# Your inbox, quacked open.
#
# Usage:
#   1. Place .mbox files in the data/ directory
#   2. Run: docker compose up --build
#   3. Open http://localhost:5173
#
# AI Configuration (all optional — defaults to local Ollama):
#
#   Chat LLM (for Q&A and summarization):
#     CHAT_API_URL    — API base URL (default: http://host.docker.internal:11434)
#     CHAT_API_KEY    — API key (blank for Ollama)
#     CHAT_MODEL      — Model name (default: llama3.1:8b)
#     CHAT_API_TYPE   — "ollama" or "openai" (default: ollama)
#
#   Embedding LLM (for semantic search and topic clustering):
#     EMBED_API_URL   — API base URL (default: http://host.docker.internal:11434)
#     EMBED_API_KEY   — API key (blank for Ollama)
#     EMBED_MODEL     — Model name (default: nomic-embed-text)
#     EMBED_API_TYPE  — "ollama" or "openai" (default: ollama)
#     EMBEDDING_DIMENSIONS — Vector size (default: 768)

services:
  backend:
    build:
      context: ./backend
    container_name: quackbox-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ${DATA_PATH:-./data}:/app/data:${DATA_MOUNT_MODE:-rw}
      - db-data:/app/db
      # Read-only host mounts so the in-app folder picker can browse for
      # additional mailbox sources beyond DATA_PATH. The container sees them
      # under /host/Users and /host/Volumes; mac users get both the home
      # directory tree and any external/network volumes. To restrict, comment
      # one out — to broaden, add additional :ro mounts.
      - /Users:/host/Users:ro
      - /Volumes:/host/Volumes:ro
    environment:
      - DATA_DIR=/app/data
      - DB_DIR=/app/db
      # --- Chat LLM (defaults to local Ollama) ---
      - CHAT_API_URL=http://host.docker.internal:11434
      - CHAT_API_KEY=
      - CHAT_MODEL=llama3.1:8b
      - CHAT_API_TYPE=ollama
      # --- Embedding LLM (defaults to local Ollama) ---
      - EMBED_API_URL=http://host.docker.internal:11434
      - EMBED_API_KEY=
      - EMBED_MODEL=nomic-embed-text
      - EMBED_API_TYPE=ollama
      - EMBEDDING_DIMENSIONS=768
      # --- Background watcher (auto re-import) ---
      - WATCH_INTERVAL_MINUTES=${WATCH_INTERVAL_MINUTES:-0}
      - WATCH_ON_STARTUP=${WATCH_ON_STARTUP:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: quackbox-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - API_URL=http://quackbox-backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
